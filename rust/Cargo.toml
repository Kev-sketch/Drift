[package]
name = "drift"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

# Native macOS shell: system WKWebView through objc2. No Tauri, no wry, no tao,
# no bundled engine, no JS runtime. See docs/BUILD.md and ../Drift/docs/ARCHITECTURE.md.

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSGeometry",
    "NSThread",
    "NSValue",
    "NSError",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSControl",
    "NSTextField",
    "NSGraphics",
    "NSRunningApplication",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKPreferences",
    "WKWebsiteDataStore",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
